name: Publicar no Instagram

on:
  schedule:
    # Reserva: o disparo principal vem do cron-job.org a cada 20 min (o agendador do GitHub não é confiável).
    - cron: "7,27,47 11-23,0 * * *"
  workflow_dispatch: {}

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pegar a versao mais nova da fila (evita post duplicado se dois disparos chegarem juntos)
        run: |
          git pull --ff-only origin main
          echo "PUB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publicar posts no horário
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python scripts/publicar.py
      - name: Registrar o que foi publicado
        if: always()
        run: |
          git config user.name "agente-promessa"
          git config user.email "agente-promessa@users.noreply.github.com"
          git add -A fila publicados
          git diff --cached --quiet || (git commit -m "Publicado: $(date -u +%F' '%H:%M) UTC" && git pull --rebase origin main && git push)
