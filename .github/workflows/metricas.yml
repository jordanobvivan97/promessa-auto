name: Metricas e freio

on:
  schedule:
    - cron: "17 10 * * *"   # todo dia 07h17 de Brasília
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/metricas.py
      - run: |
          git config user.name "agente-promessa"
          git config user.email "agente-promessa@users.noreply.github.com"
          git add metricas
          git diff --cached --quiet || (git commit -m "Metricas $(date -u +%F)" && git push)
